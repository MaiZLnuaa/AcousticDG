[Config]

# How to use:
# 1) Compile the DGalerkin sources (cmake && make)
# 2) ./DGalerkin mymesh.msh myconfig.conf
# -> First args = mesh file, Second arg = config file


meshFileName = doc/2d/PML_porous_ground2d.msh

# Initial, final time and time step(t>0)
timeStart=0.0
timeEnd=0.01
timeStep=0.0000005

# Saving rate:
timeRate=0.001

# Element Type:
# ["Lagrange", "IsoParametric", ...]
elementType=Lagrange

# Time integration method:
# ["Euler1", "Euler2", "Runge-Kutta"...]
timeIntMethod=Runge-Kutta
# timeIntMethod=Euler1

# Boundary condition:
# /!\ The physical group name must match the Gmsh name (case sensitive)
# Abs = Absorbing
# Reflecting = Reflecting
Absorbing = Absorbing
# Reflecting = Reflecting

# Number of thread
numThreads=6

# Mean Flow parameters
v0_x = 0.0
v0_y = 0
v0_z = 0
rho0 = 1.21107
c0 = 340.0

# Source:
# name = fct,x,y,z,size,intensity,frequency,phase,duration
# - fct supported = [monopole, dipole, quadrupole, formula, file (csv, wav)]
# - if fct = formula => name = fct,"formula expr",x,y,z,size,duration (ex: formulat = 0.1 * sin(2 * pi * 50 * t))
# - if fct = file => name = fct,"filename",x,y,z,size
#	suported file formats are : csv, wav
# - (x,y,z) = source position
# - intensity = source intensity
# - frequency = source frequency
# - x, y, z, size, amp, freq, phase, duration
# NB: Extended source or Multiple sources are supported.
#     (source1 = ..., source2 = ...) indice must change.
# source1 = file,"data/data.csv", 0.0,0.0,0.0, 0.1
# source2 = file,"data/data2.wav", 0.0,0.0,0.0, 0.1
# source1 = formula, "0.1 * sin(2 * pi * 50 * t)", 0.0,0.0,0.0, 0.1, 0.1
# source0 = monopole, 0.0,0.0,0.0, 1.778, 0.5, 0.033333, 0, 270
# source0 = dipolesource, 0.0,0.0,0.0, 2.236, 0.01, 0.01667, 0, 480
# source 0 = quadrupolesource, 0.0,0.0,0.0, 3.162, 0.01, 0.01667, 0, 24


# Observers position:
# name = x,y,z, size
# - (x,y,z) = position
# NB: Multiple observers are supported and recursively added.
#     (observer1 = ..., observer2 = ...)
observer1 = 1.75,0.23,0.0,0.01
observer2 = 1.75,0.46,0.0,0.01

# Initial condition:
# name = gaussian,x,y,z, size, amplitude
# - fct supported = [gaussian]
# - (x,y,z) = position
# - amplitude = initial amplitude
# NB: Multiple CI are supported and recursively added.
#     (initial condition1 = ..., initial condition = ...)
initialCondtition1 = gaussian,0,0.325,0,0.003333333,1


# Resart simulation:
# if restart simulation, restartSimulation = 1, else restartSimulation = 0 
# resartFileName needed
# modify timeStart= , timeEnd= 
# use run_caa_restart
restartSimulation = 0
resartFileName = highorder_results/result1500.vtu
 
# Porous material parameters:
# name = zkporousparm, porosity, tortuosity, resistivity, gamma
# - porosity = void fraction of the material (0 < porosity < 1)
# - tortuosity = lengthening of the acoustic path through the material (tortuosity >= 1)
# - resistivity = viscous resistivity of the material (in Rayls/m)
# - gamma = thermal parameter of the material (gamma >= 1)
# NB: Multiple porous parameters are supported and recursively added.
#     (zkporousparm1 = ..., zkporousparm2 = ...)
zkporousparm1 = 0.87, 3.2, 51375.65, 1.4
jcaporousparm1 = 0.3, 3.0, 2e7, 1.4, 1, 1, 0.71

# PML parameters:
# name = dpml, xmin, ymin, zmin, xmax, ymax, zmax
# - (xmin, ymin, zmin) = air region minimum coordinates
# - (xmax, ymax, zmax) = air region maximum coordinates
pmlparm1 = 0.50, 0.0, 0.0, 0.0, 2.5, 1.5, 0.0